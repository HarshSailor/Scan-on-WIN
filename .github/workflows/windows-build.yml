name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.426
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Upload installer, portable version and source
        uses: actions/upload-artifact@v4
        with:
          name: ScanOnWIN-Windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScanOnWIN-Test-Reports
          path: |
            artifacts/test-results/results.json
            artifacts/ui-tests/*.png
            artifacts/ui-tests/result.txt
